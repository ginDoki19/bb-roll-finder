<!-- Runs before any CSS so the stored theme is applied on the very first paint.
     Without this the page renders light, then flips to dark a frame later. -->
<script>
(function(){
  try{
    var t = localStorage.getItem("bb-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var l = localStorage.getItem("bb-lang");
    if (l !== "en" && l !== "bn"){
      /* No saved choice: follow the browser, exactly as core/language.js
         does. Kept in sync by tools/selftest.py. */
      var list = (navigator.languages && navigator.languages.length)
                 ? navigator.languages : [navigator.language];
      l = "en";
      for (var i = 0; i < list.length; i++){
        var tag = String(list[i] || "").toLowerCase();
        if (tag === "bn" || tag.indexOf("bn-") === 0){ l = "bn"; break; }
        if (tag === "en" || tag.indexOf("en-") === 0){ l = "en"; break; }
      }
    }
    document.documentElement.setAttribute("data-lang", l);
    document.documentElement.lang = l;
  }catch(e){}

  /* Font preloads are injected rather than written as static <link> tags.
     A font preload must carry crossorigin (fonts are always fetched in CORS
     mode), but over file:// the origin is null, so the browser rejects the
     request and logs a CORS error for every preloaded font before falling
     back to the @font-face rule. The page still worked; the console was just
     full of errors that looked like real breakage. Injecting them only for
     http(s) keeps the head start online and leaves file:// silent. */
  try{
    if (location.protocol === "http:" || location.protocol === "https:"){
      ["fonts/noto-sans-bengali-bengali-400-normal.woff2",
       "fonts/noto-sans-bengali-latin-400-normal.woff2",
       "fonts/noto-sans-bengali-bengali-600-normal.woff2",
       "fonts/noto-serif-bengali-bengali-600-normal.woff2",
       "fonts/noto-serif-bengali-latin-600-normal.woff2"].forEach(function(href){
        var el = document.createElement("link");
        el.rel = "preload"; el.as = "font"; el.type = "font/woff2";
        el.href = href; el.crossOrigin = "anonymous";
        document.head.appendChild(el);
      });
    }
  }catch(e){}
})();
</script>

/* ===== base.css ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0 16px 64px;
  background:var(--md-surface);
  color:var(--md-on-surface);min-height:100vh;
  /* 1.65: Bengali stacks vowel signs above and below the matra and 1.55
     clips them at small sizes. */
  font:400 16px/1.65 var(--font);
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
/* Bengali breaks if letters are squeezed — never track this text */
:lang(bn), [data-lang="bn"] body{letter-spacing:0}
.wrap{max-width:880px;margin:0 auto}
a{color:var(--md-primary)}
:focus-visible{outline:3px solid var(--md-primary);outline-offset:2px;border-radius:var(--r-xs)}

/* Available to assistive technology, not painted. clip-path rather than
   display:none — that would drop the element from the accessibility tree. */
.sr-only{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;
}
form,section{margin:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ===== layout.css ===== */
header{padding:24px 0 4px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;border-radius:var(--r-md);flex:0 0 auto;display:grid;place-items:center;
  background:var(--md-primary-container);color:var(--md-on-primary-container);
  font:600 24px/1 var(--font-display)}
h1{margin:0;font:600 clamp(20px,3.4vw,26px)/1.3 var(--font-display)}
.sub{color:var(--md-on-surface-variant);font-size:14px;margin-top:2px}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* M3 segmented button: outlined group, selected segment is tonal with a check */
.seg{display:inline-flex;border:1px solid var(--md-outline);border-radius:var(--r-full);overflow:hidden}
/* padding is 14px, not the M3 default 16px: at 14px the English control
   set (the widest) still fits beside the brand on one row. At 16px it
   overflowed by 14px and the whole header jumped 54px taller the moment
   you switched to English. uitest asserts the one-row layout in both
   languages, so this value is load-bearing. */
.seg button{position:relative;border:0;background:transparent;color:var(--md-on-surface);cursor:pointer;
  font:inherit;font-size:14px;font-weight:500;min-height:40px;padding:0 14px;line-height:1.3;
  display:inline-flex;align-items:center;gap:6px}
.seg button + button{border-left:1px solid var(--md-outline)}
.seg button::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.seg button:hover::before{opacity:.08}
.seg button:active::before{opacity:.12}
.seg button[aria-pressed="true"]{background:var(--md-secondary-container);color:var(--md-on-secondary-container)}
.seg button[aria-pressed="true"]::after{content:"\2713";font-size:13px;font-weight:600}
.seg button:focus-visible{outline-offset:-3px}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.stat{background:var(--md-surface-container);border-radius:var(--r-xs);
  padding:6px 12px;font-size:13px;color:var(--md-on-surface-variant);white-space:nowrap}
.stat b{color:var(--md-on-surface);font-weight:600}

/* ===== components.css ===== */
/* --------------------------------------------------------------- search
   M3 search bar: tall pill, filled container, leading icon, no outline until
   focus. */
.search{position:relative;margin:16px 0 6px}
.search input{width:100%;height:60px;padding:0 24px 0 58px;font-size:18px;border-radius:var(--r-full);
  background:var(--md-surface-high);border:2px solid transparent;color:var(--md-on-surface);
  outline:none;transition:border-color .15s,background .15s;font-variant-numeric:tabular-nums;font-family:inherit}
.search input:hover{background:var(--md-surface-highest)}
.search input:focus{border-color:var(--md-primary);background:var(--md-surface-low)}
.search input::placeholder{color:var(--md-on-surface-variant)}
.search svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);color:var(--md-on-surface-variant)}
.hint{color:var(--text-muted);font-size:13px;margin:8px 16px 0}
/* 7.6 — this used to be the third grey line of the footer. It is the sentence
   that stops somebody travelling on a bad match, so it sits with the search. */
.callout{display:flex;gap:8px;margin:12px 16px 0;padding:10px 14px;border-radius:var(--r-sm);
  background:var(--md-surface-container);color:var(--md-on-surface-variant);
  border-left:4px solid var(--md-tertiary);font-size:13px;line-height:1.6}

/* -------------------------------------------------------- disambiguation
   A roll number is only unique inside a job. When one number lands in more
   than one job we ask instead of guessing. */
.disambig{margin-top:16px;background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);
  border-radius:var(--r-lg);padding:18px 20px}
.disambig p{margin:0 0 4px;font-weight:600;font-size:16px}
.disambig .why{margin:0 0 14px;font-size:14px;font-weight:400}
.jobpick{display:flex;gap:8px;flex-wrap:wrap}
.jobpick button{position:relative;font:inherit;font-size:14px;text-align:left;cursor:pointer;padding:10px 16px;
  border-radius:var(--r-md);border:1px solid var(--md-outline);background:transparent;
  color:var(--md-on-tertiary-container);line-height:1.4;overflow:hidden}
.jobpick button:hover{background:rgba(127,127,127,.12)}
.jobpick button[aria-pressed="true"]{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary)}
.jobpick b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.jobpick span{font-size:13px;opacity:.9}

/* ---------------------------------------------------------------- cards
   M3 filled card: tonal container, large radius, no border. */
#result{margin-top:16px;display:grid;gap:14px}
.card{background:var(--md-surface-low);border-radius:var(--r-xl);
  padding:22px;box-shadow:var(--md-shadow);animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Not-found is a negative RESULT, not a user error: a pale error-tinted
   surface reads as "nothing here" without the alarm of a full tonal
   error container. Buttons inside drop to the card's own ink so the
   green primary never sits on pink. */
.card.bad{background:var(--md-error-surface);color:var(--md-on-surface)}
.card.bad .btn{color:var(--md-on-surface);border-color:var(--md-outline)}
.card.preferred{outline:2px solid var(--md-primary);outline-offset:-2px}

/* identity block — the primary heading of every card */
.ident{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.jobtag{flex:0 0 auto;background:var(--md-secondary-container);color:var(--md-on-secondary-container);
  border-radius:var(--r-md);padding:8px 14px;line-height:1.25}
/* "Job ID" is a fixed identifier: no uppercase transform, in either language */
.jobtag .k{font-size:12px;letter-spacing:0;text-transform:none;color:var(--md-on-secondary-container);
  font-weight:400;display:block;margin:0}
.jobtag .v{font-size:18px;font-weight:600;color:var(--md-on-secondary-container);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.identtext{min-width:0;flex:1 1 220px}
.post{font-size:clamp(18px,2.6vw,22px);font-weight:600;line-height:1.4;margin:0}
.identmeta{color:var(--text-muted);font-size:13px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.yours{background:var(--md-primary);color:var(--md-on-primary);font-size:12px;font-weight:600;
  padding:3px 10px;border-radius:var(--r-xs);align-self:center}

.kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
/* badges are M3 assist chips: small radius, tonal fill, no border */
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-xs);letter-spacing:0;border:0}
.b-seat,.b-viva{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.b-selected{background:var(--md-success-container);color:var(--md-on-success-container)}
.b-result,.b-scanned{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.b-circular,.badge.sm{background:var(--md-surface-highest);color:var(--md-on-surface-variant)}
.s-today{background:var(--md-error-container);color:var(--md-on-error-container)}
.s-soon{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.s-up{background:var(--md-success-container);color:var(--md-on-success-container)}
.s-past{background:var(--md-surface-highest);color:var(--text-muted)}

/* -------------------------------------------------------- outcome panel
   Confirmation-panel pattern: the outcome and the reference number carried
   in one tonal block. Deliberately holds no links or buttons. The headline
   is set in the serif display face — the one editorial moment on the page. */
.panel{border-radius:var(--r-lg);padding:22px 24px;margin:0 0 16px;text-align:center}
.panel.ok{background:var(--md-success-container);color:var(--md-on-success-container)}
.panel.info{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.panel.neutral{background:var(--md-surface-container);color:var(--md-on-surface)}
.panel .eyebrow{font-size:14px;letter-spacing:0;text-transform:none;font-weight:600}
.panel .big{font:600 clamp(21px,3.6vw,30px)/1.4 var(--font-display);margin:6px 0 0}
.panel .refline{margin-top:14px;padding-top:14px;border-top:1px solid currentColor;
  font-size:14px}
.panel .refline b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em}

.next{margin:20px 0 0}
.next h4{margin:0 0 8px;font-size:16px;font-weight:600}
.next ol,.next ul{margin:0;padding-left:22px;color:var(--md-on-surface-variant);font-size:15px}
.next li{margin-bottom:6px}
.next p{margin:0;color:var(--md-on-surface-variant);font-size:15px}

.cd{margin:0 0 14px;padding:14px 16px;border-radius:var(--r-md);line-height:1.5}
.cd b{display:block;font-size:18px;margin-bottom:2px;font-weight:600}
.cd span{font-size:14px}
.cd-today{background:var(--md-error-container);color:var(--md-on-error-container)}
.cd-soon{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}
.cd-past{background:var(--md-surface-container);color:var(--md-on-surface-variant)}

.prov{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);font-size:13px;line-height:1.65;
  background:var(--md-surface-container);color:var(--md-on-surface-variant)}
.prov b{color:var(--md-on-surface);font-weight:600}
/* P1-1 — a roll the OCR itself could not read twice the same way. Tertiary
   container is the same tone .det.warn uses, so "something here needs your
   attention" looks identical wherever it appears, and it is visibly not the
   neutral grey of the ordinary provenance note directly beneath it. */
.prov.warn{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);
  border-left:4px solid var(--md-tertiary)}
.prov.warn b{color:var(--md-on-tertiary-container);display:block;margin-bottom:2px}
.prov.warn a{color:var(--md-on-tertiary-container)}
.scanwarn{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);font-size:13px;line-height:1.6;
  background:var(--md-tertiary-container);color:var(--md-on-tertiary-container)}

.meta{color:var(--md-on-surface-variant);font-size:15px;margin-bottom:14px}
.meta b{color:var(--md-on-surface);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cell{background:var(--md-surface-container);border-radius:var(--r-md);padding:12px 14px}

/* Structured "what happens next": one box per fact, stacked, label left and
   value right so the eye can land on a single row. Beats a paragraph for
   somebody checking a gate-closing time on a phone the morning of an exam.
   The label column is capped so a long venue still gets most of the width;
   under 620px the label sits above the value instead. */
.dets{display:grid;gap:8px;margin-top:10px}
.det{display:grid;grid-template-columns:minmax(7.5rem,auto) 1fr;gap:2px 18px;align-items:baseline;
  background:var(--md-surface-container);border-radius:var(--r-md);padding:12px 16px}
.det .k{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--md-on-surface-variant);line-height:1.5}
.det .v{font-size:15px;font-weight:600;color:var(--md-on-surface);line-height:1.5}
.det.warn{background:var(--md-tertiary-container)}
.det.warn .k{color:var(--md-on-tertiary-container);opacity:.85}
.det.warn .v{color:var(--md-on-tertiary-container)}
.k{font-size:12px;letter-spacing:0;text-transform:none;color:var(--md-on-surface-variant);
  margin-bottom:2px;font-weight:400}
.v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.v.acc{color:var(--md-primary)} .v.warn{color:var(--md-tertiary)}

/* M3 buttons: 40px tall pills. Default is outlined, .primary is filled.
   The ::before layer is the M3 "state layer" (hover 8%, press 12%). */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;min-height:40px;padding:0 24px;border-radius:var(--r-full);
  font-size:14px;font-weight:600;border:1px solid var(--md-outline);
  color:var(--md-primary);background:transparent;cursor:pointer;
  font-family:inherit;line-height:1.3;transition:box-shadow .15s}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:hover::before{opacity:.08}
.btn:active::before{opacity:.12}
.btn.primary{background:var(--md-primary);color:var(--md-on-primary);border-color:var(--md-primary)}
.btn.primary:hover{box-shadow:var(--md-shadow, 0 1px 3px rgba(0,0,0,.3))}
.mapbox{margin-top:14px;border-radius:var(--r-lg);overflow:hidden;display:none}
/* 7.2 — offline the embed is a blank grey rectangle that reads as a broken
   build. Same footprint, but it says what is wrong. */
.mapoffline{padding:22px 18px;text-align:center;font-size:13px;line-height:1.6;
  background:var(--md-surface-container);color:var(--md-on-surface-variant)}
.mapbox iframe{width:100%;height:300px;border:0;display:block}
:root[data-theme="dark"] .mapbox iframe{filter:invert(.9) hue-rotate(180deg) saturate(.75)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mapbox iframe{filter:invert(.9) hue-rotate(180deg) saturate(.75)}
}

/* ------------------------------------------------------------ roll grid
   The old build joined every roll into one comma string inside a table
   cell, and a 1,037-roll notice stretched the PAGE sideways. A wrapping
   grid cannot do that: minmax(min(100%,…)) clamps each column to the
   container and leftover overflow is trapped inside this box. */
.rollwrap{margin-top:12px}
.rolltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rolltools input{flex:1 1 170px;min-width:0;height:40px;padding:0 16px;font-size:14px;font-family:inherit;
  border-radius:var(--r-full);border:1px solid var(--md-outline);background:transparent;
  color:var(--md-on-surface);outline:none;font-variant-numeric:tabular-nums}
.rolltools input:focus{border:2px solid var(--md-primary);padding:0 15px}
.rolltools .btn{min-height:40px;padding:0 18px;font-size:13px}
.rollcount{font-size:13px;color:var(--text-muted);margin-left:auto;font-variant-numeric:tabular-nums}
.rollgrid{display:grid;gap:6px;padding:12px;border-radius:var(--r-md);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,5.6rem),1fr));
  background:var(--md-surface-container);
  max-height:min(50vh,400px);overflow:auto;overscroll-behavior:contain}
.rollchip{font-variant-numeric:tabular-nums;text-align:center;padding:6px 4px;border-radius:var(--r-xs);
  background:var(--md-surface-high);font-size:13px;color:var(--md-on-surface-variant);white-space:nowrap}
/* 7.4 — the searched roll inside a long list. Tertiary rather than primary:
   primary is the same green as the surrounding chips' accent and the hit was
   not reliably findable by eye in a 1,037-chip grid. */
.rollchip.hit{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);
  font-weight:700;outline:2px solid var(--md-tertiary);outline-offset:-2px}
.rollempty{padding:14px;text-align:center;color:var(--text-muted);font-size:14px}
.grouphead{font-size:14px;font-weight:600;margin:14px 0 8px}
.grouphead:first-child{margin-top:4px}

/* -------------------------------------------------------- notices list */
h2{font:600 20px/1.4 var(--font-display);color:var(--md-on-surface);
  margin:36px 0 12px;display:flex;align-items:center;gap:12px}
h2 .line{flex:1;height:1px;background:var(--md-outline-variant)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
/* M3 filter chips: 32px, small radius, selected = tonal with a check */
.chip{font-size:14px;min-height:36px;padding:0 16px;border-radius:var(--r-xs);
  border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface-variant);cursor:pointer;
  font-family:inherit;line-height:1.35;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.chip:hover::before{opacity:.08}
.chip.on{background:var(--md-secondary-container);color:var(--md-on-secondary-container);border-color:transparent;font-weight:600}
.chip.on::after{content:"\2713";font-size:13px}
.ncard{background:var(--md-surface-low);border-radius:var(--r-lg);
  padding:16px 20px;margin-bottom:10px}
.nhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.npost{font-weight:600;font-size:17px;line-height:1.45;margin:0}
.ntitle{color:var(--md-on-surface-variant);font-size:14px;line-height:1.55;margin:2px 0 0}
.nmeta{color:var(--text-muted);font-size:13px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.nmeta a{color:var(--md-primary)}
.ncard.past{opacity:.7}
details{margin-top:10px}
summary{cursor:pointer;color:var(--md-primary);font-size:14px;font-weight:600;list-style:none;user-select:none;
  padding:6px 0}
summary::-webkit-details-marker{display:none}
summary:before{content:"\25B8 ";}
details[open] > summary:before{content:"\25BE "}
.arch{margin-top:26px}
.arch > summary{color:var(--md-on-surface-variant);font-size:14px}

table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--md-outline-variant);vertical-align:top}
th{font-size:12px;letter-spacing:0;text-transform:none;color:var(--md-on-surface-variant);font-weight:600}
td.num{font-variant-numeric:tabular-nums;color:var(--md-on-surface-variant);white-space:nowrap}
.tscroll{overflow-x:auto;overscroll-behavior-x:contain}

footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--md-outline-variant);color:var(--text-muted);
  font-size:13px;line-height:1.8}
footer b{color:var(--md-on-surface-variant);font-weight:600}
code{background:var(--md-surface-high);padding:1px 6px;border-radius:var(--r-xs);font-size:12px}

/* ===== responsive.css ===== */
@media(max-width:620px){
  /* The M3 header is roomier than the old one. On a phone the search field
     is the whole point of the page, so claw back the space above it —
     tighter padding and a smaller logo only. Button heights stay at 40px:
     touch targets are not negotiable. */
  header{padding:14px 0 2px}
  .topbar{gap:10px;margin-bottom:8px}
  .logo{width:40px;height:40px;font-size:20px;border-radius:var(--r-sm)}
  .seg button{padding:0 13px;font-size:13px}
  .search input{height:56px;font-size:17px;padding:0 18px 0 54px}
  .search svg{left:18px}
  .controls{margin-left:0;width:100%}
  .stats{display:none}
  th,td{padding:8px 6px}
  .card{padding:18px 16px;border-radius:var(--r-lg)}
  .panel{padding:18px 16px}
  .ncard{padding:14px 16px}
  .det{grid-template-columns:1fr;gap:3px;padding:11px 14px}
  .rollgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,4.9rem),1fr))}
}

/* ===== print.css ===== */
@media print{
  body{background:#fff;color:#000;padding:0}
  /* The masthead used to eat the whole first sheet on its own and push the
     card the reader actually wants onto page 2. On paper the branding earns
     one line, not a page. */
  header{margin:0 0 8px;padding:0;border:0}
  .stats,.sub,.logo{display:none !important}
  h1{font-size:13px !important;margin:0 !important}
  .topbar{margin:0 !important;padding:0 !important;border:0 !important;display:block !important}
  footer{font-size:9.5px;margin-top:10px}
  .controls,.filters,.search,.hint,.callout,.mapbox,.rolltools,#notices,h2,.disambig{display:none !important}
  /* A result card is nearly a full page, so break-inside:avoid on the card
     pushed it past the masthead and wasted the whole first sheet. Let the
     card flow and protect the small units instead — a row or a panel split
     across a page fold is what actually looks broken. */
  .card{box-shadow:none;border:1px solid #999;break-inside:auto}
  .panel,.det,.prov,.cd,.ident,.cell{break-inside:avoid}
  .rollgrid{max-height:none;overflow:visible}

  /* 7.7 — .actions used to be hidden outright, so somebody holding the
     printout had no way to reach the notice it came from. The buttons are
     still useless on paper, but the PDF link is not: print it as its URL.
     Everything in .actions is either that link or a button, so hiding the
     buttons and unhiding the one anchor keeps it to a single line. */
  .actions{margin-top:10px;display:block}
  .actions button{display:none !important}
  .actions a{display:none}
  /* strip the on-screen button chrome: on paper this is a line of text, not
     a control, and the pill border round a URL reads as a form field */
  .actions a[href$=".pdf"]{display:inline;font-size:10.5px;color:#000;text-decoration:none;
    border:0;background:none;padding:0;margin:0;font-weight:600}
  .actions a[href$=".pdf"]::after{content:" — " attr(data-abs);font-weight:400;word-break:break-all}
  /* P1-1 must survive onto paper — it is the warning that matters most. */
  .prov.warn{border:1px solid #000;padding:8px 10px}
}

</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">ব</div>
        <div>
          <h1 id="t-brand">BB E-Recruitment — Roll Finder</h1>
          <div class="sub" id="t-tagline"></div>
        </div>
      </div>
      <div class="controls">
        <div class="seg" id="langseg" role="group" aria-label="Language"></div>
        <div class="seg" id="themeseg" role="group" aria-label="Theme"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main id="main">
    <!-- A real <form> so the search is a landmark and mobile keyboards offer
         a submit key. There is nothing to submit — results render as you type
         — so app.js cancels the submit event; without that, Enter would
         reload the page and lose the query. -->
    <form class="search" role="search" id="searchform">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <label class="sr-only" for="roll" id="t-rolllabel"></label>
      <input id="roll" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="hint">
    </form>
    <div class="hint" id="hint"></div>
    <p class="callout" id="t-fconfirm"></p>

    <!-- The result area is NOT a live region. It can hold several full cards,
         and re-announcing all of them on every keystroke made the page
         unusable with a screen reader. #srstatus carries a one-line summary
         instead, and only when the outcome actually changes. -->
    <p id="srstatus" class="sr-only" role="status" aria-live="polite"></p>
    <div id="disambig"></div>
    <div id="result"></div>

    <section aria-labelledby="t-allnotices">
      <h2><span id="t-allnotices"></span> <span class="line"></span></h2>
      <div class="filters" id="filters" role="group" aria-label="Filter notices by type"></div>
      <div id="notices"></div>
    </section>
  </main>

  <footer>
    <div><b id="t-fdata"></b> <span id="gen"></span></div>
    <div style="margin-top:6px" id="t-fstatic"></div>
  </footer>
</div>

<script>
/* ===== core/constants.js ===== */
const KIND = {
  seat:     { key:"seat",     cls:"b-seat",     en:"Centre & seat allocation",     labEn:"SEAT PLAN", labBn:"আসন বিন্যাস" },
  viva:     { key:"viva",     cls:"b-viva",     en:"Viva / interview schedule",    labEn:"VIVA",      labBn:"ভাইভা" },
  result:   { key:"result",   cls:"b-result",   en:"Written result",               labEn:"RESULT",    labBn:"ফলাফল" },
  selected: { key:"selected", cls:"b-selected", en:"Primarily selected list",      labEn:"SELECTED",  labBn:"নির্বাচিত" },
  circular: { key:"circular", cls:"b-circular", en:"Schedule / circular",          labEn:"CIRCULAR",  labBn:"বিজ্ঞপ্তি" },
  scanned:  { key:"scanned",  cls:"b-scanned",  en:"Scanned image — not searchable",labEn:"SCANNED",  labBn:"স্ক্যান করা" }
};
/* ------------------------------------------------------------- identity
   A roll number is only unique inside a job, so the job is what every card
   leads with. The post name is what the candidate actually remembers
   applying for, so it is the headline and the job ID is the hard key. */
const POST_RE = /\bposts?\s+of\s*["'\u201c\u2018]?\s*(.+?)\s*["'\u201d\u2019]?\s*(?:\s+(?:of|in)\s+(?:SPCBL|Bangladesh\s+Bank|\d+\s+Banks?)\b|\s*\((?:Job|Grade)|\s*,|\s*$)/i;

/* ===== core/dom.js ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* esc() makes a value safe as *text*, but not as a URL: it leaves
   "javascript:..." intact, and escaping does nothing to stop a browser
   running it when the value lands in href. Every PDF link on this page
   interpolates a path that came out of data/notices.json, so the scheme is
   checked before the value is allowed to become a link.

   All 13 current notices use relative "notices/..." paths, so nothing is
   exploitable today — this closes the hole before a future notice, an
   override file or a hand-edited JSON opens it.

   Returns "" for anything rejected, which is what esc() already produced for
   a missing pdf, so the rendered markup is unchanged for existing data. */
const safeHref = u => {
  const s = String(u ?? "").trim();
  if (!s) return "";
  if (/[\u0000-\u001f\u007f]/.test(s)) return "";          // smuggled control chars
  /* "//evil.example/x.pdf" carries no scheme, so the check below waves it
     through — but a browser reads it as protocol-relative and goes off-origin
     on the current protocol. Every legitimate link here is either a relative
     notices/ path or an explicit https:// URL, so this costs nothing. */
  if (s.indexOf("//") === 0) return "";
  const scheme = /^([a-z][a-z0-9+.\-]*):/i.exec(s);        // relative paths have none
  if (scheme && !/^https?$/i.test(scheme[1])) return "";   // javascript:, data:, vbscript:
  return esc(s);
};

/* print.css prints the official-PDF link as its URL so a printed card is
   still traceable back to the notice. CSS attr() can only read what is
   literally in the attribute, and that is a relative "notices/..." path —
   useless on paper. Resolving it here rather than in a beforeprint handler
   keeps it correct when the page is rendered to PDF programmatically, which
   never fires that event. */
const pdfAttrs = u => {
  const h = safeHref(u);
  if (!h) return "";
  let abs = h;
  try { abs = new URL(String(u), location.href).href; } catch(e){}
  return `href="${h}" data-abs="${esc(abs)}"`;
};

/* ===== core/numbers.js ===== */
const BN = s => String(s).replace(/[0-9]/g, d => "০১২৩৪৫৬৭৮৯"[d]);

/* Bengali (and Arabic-Indic) numerals -> ASCII. The UI prints numbers in
   Bengali and the source PDFs do too, so a candidate copying their roll off
   this page or off the notice types ০-৯. Without this the \D strip below
   wipes the whole string and the search silently returns nothing. */
const AS = s => String(s)
  .replace(/[\u09E6-\u09EF]/g, d => d.charCodeAt(0) - 0x09E6)   // ০-৯
  .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)   // ٠-٩
  .replace(/[\uFF10-\uFF19]/g, d => d.charCodeAt(0) - 0xFF10);  // full-width

/* Clock times arrive as "10:00 AM" / "1:30 PM". In Bengali that reads like a
   machine export; people say the part of the day first — সকাল ১০:০০,
   দুপুর ১:৩০, বিকাল ৩:৩০ — and use Bengali digits. English is left alone.

   A time that does not match the expected shape — "10.00 AM", "১০টা",
   "10:00 - 11:00" — used to fall through completely and print ASCII digits in
   the middle of a Bengali card. BN() over the result fixes that: it only
   touches 0-9, so digits the replacer already localised are left alone. */
const clock = s => {
  if (!s || LANG !== "bn") return s;
  const out = String(s).replace(/(\d{1,2}):(\d{2})\s*(AM|PM)/gi, (_, h, m, ap) => {
    let hh = +h % 12; if (/pm/i.test(ap)) hh += 12;
    const part = hh >= 5 && hh < 12 ? "সকাল" : hh >= 12 && hh < 16 ? "দুপুর"
               : hh >= 16 && hh < 18 ? "বিকাল" : hh >= 18 && hh < 20 ? "সন্ধ্যা" : "রাত";
    return `${part} ${BN(+h)}:${BN(m)}`;
  });
  return BN(out);
};

/* "সকাল ১০:০০ – সকাল ১১:০০" -> "সকাল ১০:০০ – ১১:০০": say the part of the day once. */
const clockRange = (a, b) => {
  if (LANG !== "bn") return `${a} – ${b}`;
  const x = clock(a), y = clock(b), px = x.split(" ")[0];
  return `${x} – ${y.startsWith(px + " ") ? y.slice(px.length + 1) : y}`;
};

/* ===== core/dates.js ===== */
/* ---------------------------------------------------------------- dates */
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const toISO = s => {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s ?? "").trim());
  return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : null;
};
/* Both sides of the subtraction are UTC midnights. Doing it with local Date
   objects meant the gap between two calendar days was 23 or 25 hours across a
   DST change, and Math.round could then land a day out — "exam tomorrow" on
   the morning of the exam. Bangladesh keeps no DST, so this only ever bit a
   candidate checking from abroad, but the UTC form is correct everywhere and
   costs nothing. The epoch-day helper keeps TODAY a Date for anything that
   still wants one. */
const EPOCH_DAY = dt => Math.floor(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) / 86400000);
const TODAY_DAY = EPOCH_DAY(TODAY);
function dayDiff(iso){
  if (!iso) return null;
  const [y,m,d] = String(iso).split("-").map(Number);
  if (!y || !m || !d) return null;
  return Math.floor(Date.UTC(y, m-1, d) / 86400000) - TODAY_DAY;
}
/* The footer used to print DATA.generated raw, which in Bengali rendered as
   ২০২৬-১১-১২T০৩:২৪:৫৪Z — a machine stamp with a stray T and Z in the middle
   of a sentence. Only the day matters to a reader. */
const MONTHS = {
  en:["January","February","March","April","May","June","July","August","September","October","November","December"],
  bn:["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"]
};
const fmtDay = iso => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso ?? ""));
  if (!m) return dnum(iso);
  const names = MONTHS[LANG] || MONTHS.en;
  return `${NUM(+m[3])} ${names[+m[2] - 1]} ${NUM(m[1])}`;
};
function statusOf(n){
  const e = dayDiff(n.examDateISO), c = dayDiff(n.closingISO);
  if (e === 0)                       return { k:"today", cls:"s-today", lbl:t("examToday") };
  if (e !== null && e > 0 && e <= 7) return { k:"soon",  cls:"s-soon",  lbl:t("daysLeft")(NUM(e)) };
  if (e !== null && e > 7)           return { k:"up",    cls:"s-up",    lbl:t("upcoming") };
  if (c !== null && c < 0)           return { k:"past",  cls:"s-past",  lbl:t("completed") };
  if (e !== null && e < 0)           return { k:"past",  cls:"s-past",  lbl:t("completed") };
  return { k:"open", cls:"s-up", lbl:t("ongoing") };
}
function countdown(iso, timeLabel, reportBy){
  const d = dayDiff(iso);
  if (d === null) return "";
  let head, cls;
  if (d === 0)               { head = t("cdToday");          cls = "cd-today"; }
  else if (d === 1)          { head = t("cdTomorrow");       cls = "cd-soon";  }
  else if (d > 1 && d <= 21) { head = t("cdDays")(NUM(d));   cls = "cd-soon";  }
  else if (d < 0)            { head = t("cdPast")(NUM(-d));  cls = "cd-past";  }
  else return "";
  const bits = [];
  if (timeLabel) bits.push(timeLabel);
  if (reportBy)  bits.push(t("beThereBy")(reportBy));
  return `<div class="cd ${cls}"><b>${esc(head)}</b><span>${esc(bits.join(" · "))}</span></div>`;
}

/* ===== core/language.js ===== */
/* ------------------------------------------------------------- language */
/* Resolution order, strongest first:
     1. an explicit saved choice — never silently discarded;
     2. the browser's own language list, in the user's priority order, so a
        bn-BD phone opens in Bengali instead of making every visitor find the
        toggle. Most candidates reading these notices are Bengali-first;
     3. English.
   Only step 2 is new. A visitor who has ever touched the toggle keeps what
   they picked, in either direction. */
let LANG = (() => {
  try { const v = localStorage.getItem("bb-lang"); if (v === "en" || v === "bn") return v; } catch(e){}
  try {
    const list = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language];
    for (const raw of list){
      const tag = String(raw || "").toLowerCase();
      if (tag === "bn" || tag.indexOf("bn-") === 0) return "bn";
      if (tag === "en" || tag.indexOf("en-") === 0) return "en";
    }
  } catch(e){}
  return "en";
})();
/* Digits follow the interface language — Bengali UI gets ০-৯, English gets 0-9 */
const NUM = v => LANG === "bn" ? BN(v) : String(v);

/* A Job ID is a system identifier that the candidate cross-references against
   the official portal, so it is never translated and never converted to
   Bengali digits — "Job ID 307" reads the same in both languages. Roll numbers
   deliberately do NOT use this; they follow the interface language, because
   candidates read them off Bengali notices. */
const JOB = v => String(v ?? "—");

/* One notice can cover several job IDs at once: 20261029_bb_372 carries
   "280, 282, 289, 294, 295, 296, 299, 300". Printed whole it overflows a badge
   and buries the one number the candidate is looking for, so the badge shows
   the first plus a count and the full list moves to the tooltip. */
const JOB_LIST  = v => String(v ?? "").split(",").map(s => s.trim()).filter(Boolean);
const JOB_LABEL = v => { const p = JOB_LIST(v); return p.length > 1 ? `${p[0]} + ${p.length - 1}` : JOB(v); };
const jobAttr   = v => { const p = JOB_LIST(v);
  return p.length > 1 ? ` title="${esc(t("job"))} ${esc(p.join(", "))}"` : ""; };

/* Missing Bengali copy falls back to English rather than showing a raw key. */

/* ---------------------------------------------------------------- index */
const notices = DATA.notices.slice();
const scannedCount = notices.filter(n => n.kind === "scanned").length;
notices.forEach(n => {
  if (n.rolls) n._set = new Set(n.rolls.map(String));
  if (n.centres) n.centres.sort((a, b) => a.from - b.from);
  /* Sittings arrive delta-encoded: r = [first, gap, gap, ...]. Undo the deltas
     and build one Map for O(1) roll lookup. Done once at load; for the whole
     dataset this is well under a millisecond, and it keeps the shipped JSON
     5.6x smaller than storing a record per roll. */
  if (n.sittings){
    n._rolls = new Map();
    n._count = 0;
    for (const s of n.sittings){
      let acc = 0;
      for (const d of s.r){ acc += d; n._rolls.set(acc, s); n._count++; }
    }
  }
});
const searchable = notices.filter(n => n.centres || n.sittings || n.rolls);

function findCentre(n, roll){
  const v = n.centres;
  let lo = 0, hi = v.length - 1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1, c = v[mid];
    if (roll < c.from) hi = mid - 1;
    else if (roll > c.to) lo = mid + 1;
    else return c;
  }
  return null;
}
/* "3:00 PM" minus 60 minutes -> "2:00 PM" */
function minus60(label){
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(label || "");
  if (!m) return null;
  let h = parseInt(m[1], 10) % 12 + (m[3].toUpperCase() === "PM" ? 12 : 0);
  let x = (h * 60 + parseInt(m[2], 10) - 60 + 1440) % 1440;
  const hh = Math.floor(x / 60), mm = String(x % 60).padStart(2, "0");
  return `${(hh % 12) || 12}:${mm} ${hh < 12 ? "AM" : "PM"}`;
}

/* ===== features/results.js ===== */
function postOf(n, group){
  if (group && group.post) return group.post;
  const g = n.groups || [];
  if (g.length === 1 && g[0].post) return g[0].post;
  if (g.length > 1) return null;                       // multi-post notice
  const title = n.title || "";
  if (/\d+\s+category\s+posts?/i.test(title)) return null;
  const m = POST_RE.exec(title);
  if (!m) return null;
  const p = m[1].replace(/[.\s]+$/, "").trim();
  if (!p || p.length > 60 || /circular|^spcbl/i.test(p)) return null;
  return p;
}
function identBlock(n, group, opts){
  opts = opts || {};
  const post = postOf(n, group);
  const bits = [];
  if (n.noticeNo)  bits.push(`${t("notice")} ${dnum(n.noticeNo)}`);
  if (n.published) bits.push(`${t("published")} ${dnum(n.published)}`);
  return `<div class="ident">
    <div class="jobtag"${jobAttr(n.jobId)}><span class="k">${esc(t("job"))}</span><span class="v">${esc(JOB_LABEL(n.jobId))}</span></div>
    <div class="identtext">
      <p class="post">${esc(post || t("multiPost"))}</p>
      ${bits.length ? `<div class="identmeta">${bits.map(b => `<span>${esc(b)}</span>`).join("")}</div>` : ""}
    </div>
    ${opts.preferred ? `<span class="yours">${esc(t("yoursBadge"))}</span>` : ""}
  </div>`;
}

/* ------------------------------------------------------------ provenance
   Never let an OCR-derived list look hand-checked, and never let either look
   like machine-extracted text. The wording differs on purpose. */
function provenance(n){
  if (n.rollSource === "ocr"){
    const tot = n.ocrChecks && n.ocrChecks.printedTotal ? dnum(n.ocrChecks.printedTotal) : "";
    return `<div class="prov">${t("ocrProv")(tot)}<a ${pdfAttrs(n.pdf)} target="_blank" rel="noopener noreferrer">${esc(t("confirmPdf"))}</a>${esc(t("stop"))}</div>`;
  }
  if (n.rollSource === "manual"){
    return `<div class="prov">${t("manualProv")}<a ${pdfAttrs(n.pdf)} target="_blank" rel="noopener noreferrer">${esc(t("confirmPdf"))}</a>${esc(t("stop"))}</div>`;
  }
  return "";
}

/* ------------------------------------------------- low-confidence rolls
   The OCR records the rolls it could not read the same way twice in
   ocrChecks.lowConfidence. Until now nothing read that field, so a candidate
   whose number was one of them got the ordinary green "you are on the list"
   card with no hint that the scan was unclear at exactly their number.

   The list is deliberately kept in rolls[] rather than dropped — a candidate
   searching a number the notice really does contain must not be told it is
   absent — so the disclosure has to happen at render time instead. */
function lowConf(n, roll){
  const lc = n.ocrChecks && n.ocrChecks.lowConfidence;
  if (!lc || !lc.length) return false;
  return lc.map(String).indexOf(String(roll)) !== -1;
}
function lowConfBlock(n, roll){
  if (!lowConf(n, roll)) return "";
  return `<div class="prov warn" role="note">
    <b>${esc(t("lowConfTitle"))}</b> ${esc(t("lowConfBody"))}
    <a ${pdfAttrs(n.pdf)} target="_blank" rel="noopener noreferrer">${esc(t("confirmPdf"))}</a>${esc(t("stop"))}</div>`;
}

/* --------------------------------------------------------- outcome panel */
function outcomeOf(n){
  const txt = `${n.title || ""} ${n.category || ""}`;
  const hl = LANG === "bn" ? (n.headlineBn || n.headline) : (n.headline || n.headlineBn);
  if (hl) return { tone:"ok", title:hl, steps:null };
  if (/offer\s+letter/i.test(txt))        return { tone:"ok", title:t("congratsOffer"),   steps:t("nextOffer") };
  if (/primarily\s+selected|selected\s+candidate/i.test(txt))
                                          return { tone:"ok", title:t("congratsPrimary"), steps:t("nextPrimary") };
  return { tone:"neutral", title:t("congratsGeneric"), steps:t("nextPrimary") };
}
function detailRows(details){
  return `<div class="dets">` + details.map(d =>
    `<div class="det${d.warn ? " warn" : ""}">` +
      `<div class="k">${esc(d.k)}</div><div class="v">${esc(d.v)}</div></div>`).join("") + `</div>`;
}
/* A curated notice can describe the next step two ways. `details` is a list
   of labelled facts and wins, because a candidate scanning for a time or a
   gate-closing deadline should not have to read a paragraph to find it.
   `note` is the older free-prose form and stays as the fallback. */
function nextBlock(steps, note, details){
  if (details && details.length)
    return `<div class="next"><h4>${esc(t("whatNext"))}</h4>${detailRows(details)}</div>`;
  if (note) return `<div class="next"><h4>${esc(t("whatNext"))}</h4><p>${esc(note)}</p></div>`;
  if (!steps || !steps.length) return "";
  return `<div class="next"><h4>${esc(t("whatNext"))}</h4><ol>${
    steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`;
}

function rollWrapHtml(rolls, hit){

/* The chip for the number you just searched. Every caller passed hit=null, so
   the .hit style existed but never applied to anything; reading the live
   search box means opening any list highlights your roll without the archive
   having to be re-rendered on every keystroke. */
const currentRoll = () => AS(($("#roll") || {}).value || "").replace(/\D/g, "");
function paintRolls(wrap){
  const all = (wrap.dataset.rolls || "").split(",").filter(Boolean);
  const hit = wrap.dataset.hit || currentRoll();
  const q   = AS((wrap.querySelector(".rollfilter") || {}).value || "").replace(/\D/g, "");
  const list = q ? all.filter(r => r.includes(q)) : all;
  const grid = wrap.querySelector(".rollgrid");
  grid.innerHTML = list.length
    ? list.map(r => `<span class="rollchip${r === hit ? " hit" : ""}">${esc(NUM(r))}</span>`).join("")
    : `<div class="rollempty">${esc(t("noMatchInList"))}</div>`;
  wrap.querySelector(".rollcount").textContent =
    q ? t("showing")(NUM(list.length), NUM(all.length)) : NUM(all.length);
  /* A 1,037-chip grid scrolls inside itself, so a highlighted chip is usually
     off-screen when the list opens. */
  const chip = grid.querySelector(".rollchip.hit");
  if (chip && chip.scrollIntoView) chip.scrollIntoView({ block:"nearest", inline:"nearest" });

/* ===== features/search.js ===== */
/* --------------------------------------------------------------- search */
let prefJob = (() => { try { return localStorage.getItem("bb-job") || ""; } catch(e){ return ""; } })();
let lastHits = [];

function collectHits(roll, raw){
  const hits = [];
  for (const n of notices){
    if (n.centres){
      const c = findCentre(n, roll);
      if (c) hits.push({ n, job:String(n.jobId || ""), html:() => seatCard(n, c, raw, isPref(n)) });
    }
    if (n._rolls && n._rolls.has(roll)){
      const s = n._rolls.get(roll);
      hits.push({ n, job:String(n.jobId || ""), html:() => sittingCard(n, { d:s.date, t:s.time, b:s.sl }, raw, isPref(n)) });
    }
    if (n._set && n._set.has(String(roll))){
      hits.push({ n, job:String(n.jobId || ""), html:() => selectedCard(n, roll, isPref(n)) });
    }
  }
  return hits;
}
const isPref = n => !!prefJob && String(n.jobId || "") === prefJob;

/* Announce an outcome once. #result deliberately is not a live region: it can
   hold several full cards, and with aria-live on it a screen reader re-read
   every card on every keystroke. Writing only when the sentence actually
   changes also stops repeat announcements when a keystroke does not change
   the outcome. */
let lastSaid = "";
function say(msg){
  const el = $("#srstatus");
  if (!el || msg === lastSaid) return;
  lastSaid = msg;
  el.textContent = msg;
}

function renderResult(){
  const raw = AS($("#roll").value).replace(/\D/g, "");
  const box = $("#result"), dis = $("#disambig");
  if (!raw){ box.innerHTML = ""; dis.innerHTML = ""; lastHits = []; say(""); return; }

  if (raw.length < 3){
    dis.innerHTML = "";
    box.innerHTML = `<div class="card bad"><div class="meta" style="margin:0">${esc(t("tooShort")(NUM(raw)))}</div></div>`;
    say(t("tooShort")(NUM(raw)));
    return;
  }
  const roll = parseInt(raw, 10);
  lastHits = collectHits(roll, raw);

  if (!lastHits.length){
    dis.innerHTML = "";
    const cover = searchable.map(n => {
      const p = postOf(n);
      const kind = (KIND[n.kind] || {}).en || n.kind;
      return `<li>${esc(t("job"))} ${esc(JOB_LABEL(n.jobId))} — ${esc(p ? `${p} · ${kind}` : kind)}</li>`;
    }).join("");
    box.innerHTML = `<div class="card bad">
      <p class="post" style="margin-bottom:8px">${esc(t("notFoundTitle")(NUM(raw)))}</p>
      <div class="meta">${esc(t("notFoundBody")(NUM(searchable.length)))}</div>
      <div class="meta" style="margin-bottom:6px"><b>${esc(t("notFoundList"))}</b></div>
      <ul style="color:var(--text-secondary);font-size:13px;margin:0 0 0 18px;padding:0">${cover}</ul>
      <div class="actions"><a class="btn" href="${safeHref(DATA.source)}" target="_blank" rel="noopener noreferrer">${esc(t("checkPortal"))}</a></div>
    </div>`;
    say(t("notFoundTitle")(NUM(raw)));
    return;
  }
  paintHits(raw);
}

function paintHits(raw){
  const dis = $("#disambig"), box = $("#result");
  const jobs = [...new Set(lastHits.map(h => h.job))].filter(Boolean);

  /* The core fix: one roll can legitimately belong to two unrelated jobs,
     so when that happens we say so and let the candidate choose. */
  if (jobs.length > 1){
    const opts = jobs.map(j => {
      const n = lastHits.find(h => h.job === j).n;
      const p = postOf(n);
      return `<button type="button" data-job="${esc(j)}" aria-pressed="${prefJob === j}"${jobAttr(j)}>
        <b>${esc(t("job"))} ${esc(JOB_LABEL(j))}</b><span>${esc(p || (KIND[n.kind]||{}).en || n.kind)}</span></button>`;
    }).join("");
    dis.innerHTML = `<div class="disambig">
      <p>${esc(t("disambigQ")(NUM(raw), NUM(jobs.length)))}</p>
      <p class="why">${esc(t("disambigWhy"))}</p>
      <div class="jobpick">${opts}
        <button type="button" data-job="" aria-pressed="${!prefJob}">${esc(t("showAll"))}</button></div>
    </div>`;
  } else dis.innerHTML = "";

  /* A remembered job floats to the top but nothing is ever hidden. */
  const ordered = lastHits.slice().sort((a, b) =>
    (isPref(b.n) ? 1 : 0) - (isPref(a.n) ? 1 : 0));
  box.innerHTML = ordered.map(h => h.html()).join("");

  say(jobs.length > 1
    ? t("srAmbig")(NUM(ordered.length), NUM(raw), NUM(jobs.length))
    : t("srFound")(NUM(ordered.length), NUM(raw)));
}

function renderNotices(){
  const kinds = ["all", ...new Set(notices.map(n => n.kind))];
  $("#filters").innerHTML = kinds.map(k => {
    const lbl = k === "all"
      ? `${t("all")} ${NUM(notices.length)}`
      : `${kindLabel(k)} ${NUM(notices.filter(n => n.kind === k).length)}`;
    return `<button type="button" class="chip${k === filter ? " on" : ""}" data-f="${esc(k)}" aria-pressed="${k === filter}">${esc(lbl)}</button>`;
  }).join("");

  const shown = notices.filter(n => filter === "all" || n.kind === filter);
  const live = shown.filter(n => statusOf(n).k !== "past");
  const past = shown.filter(n => statusOf(n).k === "past");
  const order = { today:0, soon:1, up:2, open:3 };
  live.sort((a, b) => order[statusOf(a).k] - order[statusOf(b).k]);

  /* Archived notices stay fully searchable — they are only collapsed out of
     the way. People look backwards during appeals and document checks. */
  $("#notices").innerHTML = live.map(noticeCard).join("")
    + (past.length ? `<details class="arch"><summary>${esc(t("pastNotices")(NUM(past.length)))}</summary>${
        past.map(noticeCard).join("")}</details>` : "");
}

/* ===== features/preferences.js ===== */
/* -------------------------------------------------------------- toggles */
function applyTheme(mode){
  const r = document.documentElement;
  if (mode === "system") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme", mode);
  try { mode === "system" ? localStorage.removeItem("bb-theme") : localStorage.setItem("bb-theme", mode); } catch(e){}
  renderToggles();
}
function currentTheme(){
  try { return localStorage.getItem("bb-theme") || "system"; } catch(e){ return "system"; }
}
function renderToggles(){
  const th = currentTheme();
  $("#themeseg").innerHTML = ["system","light","dark"].map(m =>
    `<button type="button" data-theme-set="${m}" aria-pressed="${th === m}">${esc(t(m))}</button>`).join("");
  $("#langseg").innerHTML = [["bn","বাংলা"],["en","English"]].map(([c, l]) =>
    `<button type="button" data-lang-set="${c}" aria-pressed="${LANG === c}">${esc(l)}</button>`).join("");
}
function applyLang(code){
  LANG = code;
  try { localStorage.setItem("bb-lang", code); } catch(e){}
  document.documentElement.setAttribute("data-lang", code);
  document.documentElement.lang = code;
  paintStatic();
  renderToggles();
  // The box the user typed into is the one thing paintStatic cannot reach:
  // it holds a value, not a label. Round-trip it through ASCII so Bengali
  // digits become 200983 in English and 2009৮3 can never survive a switch.
  const box = $("#roll");
  if (box && box.value.trim()) box.value = NUM(AS(box.value));
  /* P4-3: say() suppresses a repeat of the same sentence, so after a language
     switch the status line kept the old-language text until the next
     keystroke. Clearing the memo lets renderResult() re-announce it. */
  lastSaid = "";
  renderNotices();
  renderResult();
}
function paintStatic(){
  $("#t-tagline").textContent    = t("tagline");
  $("#roll").placeholder         = t("placeholder");
  $("#t-rolllabel").textContent  = t("rollLabel");
  $("#t-allnotices").textContent = t("allNotices");
  $("#t-fdata").textContent      = t("fData");
  $("#t-fconfirm").textContent   = t("fConfirm");
  $("#t-fstatic").textContent    = t("fStatic");

  const centres = notices.reduce((a, n) => a + (n.centres ? n.centres.length : 0), 0);
  const rolls   = notices.reduce((a, n) => a + (n._count || 0) + (n.rolls ? n.rolls.length : 0), 0);
  $("#stats").innerHTML =
    `<span class="stat"><b>${NUM(notices.length)}</b> ${esc(t("statNotices"))}</span>
     <span class="stat"><b>${NUM(centres)}</b> ${esc(t("statCentres"))}</span>
     <span class="stat"><b>${NUM(rolls.toLocaleString("en-US"))}</b> ${esc(t("statRolls"))}</span>`;
  $("#hint").textContent = t("hintBase")(NUM(searchable.length))
    + (scannedCount ? t("hintScanned")(NUM(scannedCount)) : "");

  const age = dayDiff(DATA.generated.slice(0, 10));
  const fresh = age === 0 ? t("updToday") : age === -1 ? t("updYesterday")
              : age < 0 ? t("updDays")(NUM(-age)) : t("upd");
  $("#gen").textContent = `${fresh} ${t("builtFrom")(fmtDay(DATA.generated), NUM(notices.length))} ${t("fDataRest")}`;
}

/* ===== app.js ===== */
/* --------------------------------------------------------- interactions */
document.addEventListener("click", e => {
  const map = e.target.closest("[data-map]");
  if (map){
    const box = map.closest(".card").querySelector(".mapbox");
    const ifr = box.querySelector("iframe");
    const open = box.style.display === "block";
    box.style.display = open ? "none" : "block";
    map.textContent = open ? t("showMap") : t("hideMap");
    map.setAttribute("aria-expanded", open ? "false" : "true");
    /* The embed is the one part of this page that needs the network. Offline
       it rendered as a blank grey rectangle that looked like a broken build,
       so say what is wrong and leave the Google Maps button as the way out. */
    if (!open && !navigator.onLine && !ifr.src){
      if (!box.querySelector(".mapoffline")){
        const msg = document.createElement("div");
        msg.className = "mapoffline";
        msg.textContent = t("mapOffline");
        box.appendChild(msg);
      }
      return;
    }
    const off = box.querySelector(".mapoffline");
    if (off) off.remove();
    if (!open && !ifr.src) ifr.src = ifr.dataset.src;
    return;
  }

  /* 7.8 — share. Web Share where it exists (Android/iOS), clipboard
     everywhere else; both paths confirm in the button itself. */
  const sh = e.target.closest("[data-share]");
  if (sh){
    const url = location.origin + location.pathname + "#roll=" + sh.dataset.share;
    const done = () => {
      const was = sh.textContent;
      sh.textContent = t("shared");
      setTimeout(() => { sh.textContent = was; }, 1600);
    };
    if (navigator.share) navigator.share({ title: document.title, url }).catch(() => {});
    else navigator.clipboard?.writeText(url).then(done).catch(() => {});
    return;
  }
  const th = e.target.closest("[data-theme-set]");
  if (th){ applyTheme(th.dataset.themeSet); return; }

  const lg = e.target.closest("[data-lang-set]");
  if (lg){ applyLang(lg.dataset.langSet); return; }

  const jp = e.target.closest("[data-job]");
  if (jp){
    prefJob = jp.dataset.job || "";
    try { prefJob ? localStorage.setItem("bb-job", prefJob) : localStorage.removeItem("bb-job"); } catch(err){}
    paintHits(AS($("#roll").value).replace(/\D/g, ""));
    return;
  }
  const cp = e.target.closest(".rollcopy");
  if (cp){
    const wrap = cp.closest(".rollwrap");
    const txt = (wrap.dataset.rolls || "").split(",").join(", ");
    navigator.clipboard?.writeText(txt).then(() => {
      cp.textContent = t("copied");
      setTimeout(() => { cp.textContent = t("copyAll"); }, 1400);
    }).catch(() => {});
    return;
  }
  const f = e.target.closest("[data-f]");
  if (f){ filter = f.dataset.f; renderNotices(); return; }
});

let filterTimer = 0;
document.addEventListener("input", e => {
  if (!e.target.classList.contains("rollfilter")) return;
  /* The longest list is 1,037 chips. Rebuilding that grid on every keystroke
     is visibly janky on a low-end phone; one frame of debounce is below the
     threshold where typing feels laggy and skips most of the work. */
  const wrap = e.target.closest(".rollwrap");
  clearTimeout(filterTimer);
  filterTimer = setTimeout(() => paintRolls(wrap), 60);
});
/* build the chips only when a list is actually opened */
document.addEventListener("toggle", e => {
  if (e.target.tagName !== "DETAILS" || !e.target.open) return;
  e.target.querySelectorAll(".rollwrap").forEach(w => {
    if (!w.dataset.painted){ w.dataset.painted = "1"; paintRolls(w); }
  });
}, true);

/* offline support — only meaningful over http(s); silently skipped on file:// */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

/* -------------------------------------------------------------- surface
   The files in assets/js are concatenated into one classic <script>, so they
   already share a scope and call each other directly by name. BB does not
   provide that sharing and nothing above depends on it.

   What it is for: a single declared list of what each module contributes, so
   the split is visible from the console and testable from Playwright. If a
   file is ever dropped from JS_FILES in build_site.py, the matching BB entry
   throws at build time instead of failing silently in some rarely-hit branch.

   Deliberately not a module system: wrapping each file in an IIFE and routing
   every call through BB.* would mean rewriting several hundred call sites for
   no behavioural gain on a page that loads no other scripts. */
const BB = {
  dom:         { $, esc, safeHref, pdfAttrs },
  numbers:     { BN, AS, NUM, JOB, JOB_LIST, JOB_LABEL, jobAttr, clock, clockRange },
  dates:       { TODAY, toISO, dayDiff, statusOf, countdown, dnum, fmtDay },
  language:    { get lang(){ return LANG; }, t, STR, kindLabel },
  constants:   { KIND, POST_RE },
  data:        { DATA, notices, searchable, scannedCount, findCentre, minus60 },
  maps:        { mapsUrl },
  results:     { postOf, identBlock, provenance, outcomeOf, nextBlock,
                 lowConf, lowConfBlock, shareBtn,
                 seatCard, sittingCard, selectedCard },
  rolls:       { rollWrapHtml, paintRolls },
  search:      { collectHits, isPref, renderResult, paintHits, say },
  noticeList:  { noticeCard, renderNotices },
  preferences: { applyTheme, currentTheme, renderToggles, applyLang, paintStatic }
};
window.BB = BB;

/* ------------------------------------------------------------------ boot */
(function boot(){
  document.documentElement.setAttribute("data-lang", LANG);
  document.documentElement.lang = LANG;
  paintStatic();
  renderToggles();
  renderNotices();

  /* The search is a <form> so it is a landmark and so mobile keyboards show
     a submit key, but there is no server to submit to — results render as
     you type. Without this, Enter would navigate and throw the query away. */
  $("#searchform").addEventListener("submit", e => { e.preventDefault(); renderResult(); });

  $("#roll").addEventListener("input", renderResult);
  $("#roll").addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.target.value = ""; renderResult(); }
  });

  /* "/" jumps to the search box unless the user is already typing somewhere.
     Deliberately not an autofocus: on a phone an autofocus opens the keyboard
     over the content before the visitor has seen the page, so the focus is
     only taken on a device that has a real pointer. */
  document.addEventListener("keydown", e => {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    const el = document.activeElement, tag = el ? el.tagName : "";
    if (tag === "INPUT" || tag === "TEXTAREA" || (el && el.isContentEditable)) return;
    e.preventDefault();
    $("#roll").focus();
    $("#roll").select();
  });
  try {
    if (window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches) $("#roll").focus();
  } catch(e){}

  const m = AS(decodeURIComponent(location.hash)).match(/roll=(\d+)/);
  if (m){ $("#roll").value = m[1]; renderResult(); }
})();

</script>
