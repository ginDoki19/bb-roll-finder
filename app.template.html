<!DOCTYPE html>
<html lang="bn" data-lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB E-Recruitment — Roll Finder</title>
<meta name="description" content="Enter your roll number to find your Bangladesh Bank exam centre, seat range, date, time and map location. Seat plans, viva schedules and selected-candidate lists in one place.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="BB E-Recruitment — Roll Finder">
<meta property="og:description" content="Find your exam centre, seat, time and map by roll number.">
<meta property="og:type" content="website">

<link rel="preload" as="font" type="font/woff2" href="fonts/hind-siliguri-bengali-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/hind-siliguri-latin-400.woff2" crossorigin>

<!-- Runs before any CSS so the stored theme is applied on the very first paint.
     Without this the page renders light, then flips to dark a frame later. -->
<script>
(function(){
  try{
    var t = localStorage.getItem("bb-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var l = localStorage.getItem("bb-lang");
    if (l === "en" || l === "bn"){
      document.documentElement.setAttribute("data-lang", l);
      document.documentElement.lang = l;
    }
  }catch(e){}
})();
</script>

<style>
  /* ---------------------------------------------------------------- fonts
     Hind Siliguri, self-hosted. Two files per weight split by script, so the
     Latin text does not drag the 71 KB Bengali file around and vice versa.
     font-display:swap means the system stack below paints immediately and
     the webfont swaps in when it arrives — nobody waits on a blank screen. */
  @font-face{
    font-family:"Hind Siliguri";font-style:normal;font-weight:400;font-display:swap;
    src:url("fonts/hind-siliguri-bengali-400.woff2") format("woff2");
    unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0,U+1CD2,U+1CD5-1CD6,U+1CD8,
      U+1CE1,U+1CEA,U+1CED,U+1CF2,U+1CF5-1CF7,U+200C-200D,U+20B9,U+25CC,U+A8F1;
  }
  @font-face{
    font-family:"Hind Siliguri";font-style:normal;font-weight:600;font-display:swap;
    src:url("fonts/hind-siliguri-bengali-600.woff2") format("woff2");
    unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0,U+1CD2,U+1CD5-1CD6,U+1CD8,
      U+1CE1,U+1CEA,U+1CED,U+1CF2,U+1CF5-1CF7,U+200C-200D,U+20B9,U+25CC,U+A8F1;
  }
  @font-face{
    font-family:"Hind Siliguri";font-style:normal;font-weight:400;font-display:swap;
    src:url("fonts/hind-siliguri-latin-400.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,
      U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:"Hind Siliguri";font-style:normal;font-weight:600;font-display:swap;
    src:url("fonts/hind-siliguri-latin-600.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
      U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,
      U+2215,U+FEFF,U+FFFD;
  }

  /* --------------------------------------------------------------- tokens
     Semantic names, never raw hex in a component rule. Every text/surface
     pair below was checked with the WCAG relative-luminance formula against
     the LIGHTEST surface it can sit on, in both themes. */
  :root{
    color-scheme: light dark;

    --surface-0:#f4f6f9;  --surface-1:#ffffff;  --surface-2:#f7f9fc;  --surface-3:#eef1f6;
    --text-primary:#121823; --text-secondary:#4c5668; --text-muted:#626c7d;
    --border:#dde3ec; --border-strong:#bac4d3; --border-control:#7a8697;
    --accent:#0b6e80; --accent-ink:#ffffff; --accent-soft:#e2f2f5; --accent-line:#9ccdd7;
    --ok:#0f7445;   --ok-soft:#e4f4ec;   --ok-line:#9ed3b8;
    --warn:#8a5300; --warn-soft:#fcf1dd; --warn-line:#e3c184;
    --bad:#b32025;  --bad-soft:#fdeaea;  --bad-line:#eeb0b0;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    --glow:none;
    --r:14px;
    --font:"Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto,
           "Noto Sans Bengali", "Nirmala UI", "Kohinoor Bangla",
           "Bangla Sangam MN", "Lohit Bengali", sans-serif;
  }

  /* OS preference wins only while the visitor has not chosen for themselves */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-0:#0f131a; --surface-1:#161b24; --surface-2:#1d232e; --surface-3:#262d3a;
      --text-primary:#e9edf4; --text-secondary:#aab5c7; --text-muted:#8d99ab;
      --border:#2a3240; --border-strong:#3d4759; --border-control:#66738c;
      --accent:#5ecfe4; --accent-ink:#04212a; --accent-soft:#132b35; --accent-line:#2b5d6b;
      --ok:#5fd49a;   --ok-soft:#10291f;   --ok-line:#2c5c45;
      --warn:#eab543; --warn-soft:#2a2113; --warn-line:#5d4a20;
      --bad:#f2918a;  --bad-soft:#2d1719;  --bad-line:#633033;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
      --glow:radial-gradient(1100px 520px at 12% -12%, rgba(94,207,228,.07), transparent 60%);
    }
  }
  /* explicit choice always wins */
  :root[data-theme="dark"]{
    --surface-0:#0f131a; --surface-1:#161b24; --surface-2:#1d232e; --surface-3:#262d3a;
    --text-primary:#e9edf4; --text-secondary:#aab5c7; --text-muted:#8d99ab;
    --border:#2a3240; --border-strong:#3d4759; --border-control:#66738c;
    --accent:#5ecfe4; --accent-ink:#04212a; --accent-soft:#132b35; --accent-line:#2b5d6b;
    --ok:#5fd49a;   --ok-soft:#10291f;   --ok-line:#2c5c45;
    --warn:#eab543; --warn-soft:#2a2113; --warn-line:#5d4a20;
    --bad:#f2918a;  --bad-soft:#2d1719;  --bad-line:#633033;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28);
    --glow:radial-gradient(1100px 520px at 12% -12%, rgba(94,207,228,.07), transparent 60%);
  }
  :root[data-theme="dark"]{ color-scheme: dark }
  :root[data-theme="light"]{ color-scheme: light }

  /* ----------------------------------------------------------------- base */
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0 16px 64px;
    background:var(--glow), var(--surface-0);
    background-attachment:fixed;
    color:var(--text-primary);min-height:100vh;
    /* 1.65 rather than 1.55: Bengali stacks vowel signs above and below the
       matra, and 1.55 clips them at small sizes. */
    font:16px/1.65 var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-wrap:break-word;
  }
  /* Bengali breaks if letters are squeezed — never negative-track this text */
  :lang(bn), [data-lang="bn"] body{letter-spacing:0}
  .wrap{max-width:1040px;margin:0 auto}
  a{color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* --------------------------------------------------------------- header */
  header{padding:26px 0 6px}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
    background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:20px}
  h1{margin:0;font-size:clamp(18px,3vw,25px);font-weight:600;line-height:1.3}
  .sub{color:var(--text-secondary);font-size:13.5px;margin-top:1px}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-control);
    border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--text-secondary);cursor:pointer;
    font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;line-height:1.3}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .seg button:hover:not([aria-pressed="true"]){color:var(--text-primary)}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
    padding:5px 12px;font-size:12px;color:var(--text-secondary);white-space:nowrap}
  .stat b{color:var(--text-primary);font-weight:600}

  /* --------------------------------------------------------------- search */
  .search{position:relative;margin:18px 0 6px}
  .search input{width:100%;padding:20px 20px 20px 56px;font-size:19px;border-radius:var(--r);
    background:var(--surface-1);border:1.5px solid var(--border-control);color:var(--text-primary);
    outline:none;transition:.18s;font-variant-numeric:tabular-nums;font-family:inherit}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .search input::placeholder{color:var(--text-muted)}
  .search svg{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
  .hint{color:var(--text-muted);font-size:12.5px;margin:8px 2px 0}

  /* -------------------------------------------------------- disambiguation
     The whole reason this exists: a roll number is only unique inside a job.
     When one number lands in more than one job we ask instead of guessing. */
  .disambig{margin-top:16px;background:var(--warn-soft);border:1px solid var(--warn-line);
    border-radius:var(--r);padding:16px 18px}
  .disambig p{margin:0 0 4px;font-weight:600;font-size:15px;color:var(--text-primary)}
  .disambig .why{margin:0 0 12px;font-size:13px;color:var(--text-secondary);font-weight:400}
  .jobpick{display:flex;gap:8px;flex-wrap:wrap}
  .jobpick button{font:inherit;font-size:13.5px;text-align:left;cursor:pointer;padding:10px 14px;
    border-radius:10px;border:1.5px solid var(--border-control);background:var(--surface-1);
    color:var(--text-primary);line-height:1.4;transition:.15s}
  .jobpick button:hover{border-color:var(--accent)}
  .jobpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .jobpick b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
  .jobpick span{color:var(--text-secondary);font-size:12.5px}

  /* ---------------------------------------------------------------- cards */
  #result{margin-top:16px;display:grid;gap:14px}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
    padding:20px;box-shadow:var(--shadow);animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card.bad{border-color:var(--bad-line);background:var(--bad-soft)}
  .card.preferred{border-color:var(--accent);border-width:1.5px}

  /* identity block — the primary heading of every card */
  .ident{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .jobtag{flex:0 0 auto;background:var(--accent-soft);border:1px solid var(--accent-line);
    border-radius:11px;padding:7px 13px;line-height:1.25}
  .jobtag .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-secondary);
    font-weight:600;display:block}
  .jobtag .v{font-size:17px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .identtext{min-width:0;flex:1 1 220px}
  .post{font-size:clamp(17px,2.5vw,21px);font-weight:600;line-height:1.35;margin:0}
  .identmeta{color:var(--text-muted);font-size:12.5px;margin-top:3px;
    display:flex;gap:10px;flex-wrap:wrap}
  .yours{background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:600;
    padding:2px 8px;border-radius:999px;letter-spacing:.04em;align-self:center}

  .kicker{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.03em;
    border:1px solid}
  .b-seat{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .b-viva{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .b-selected{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .b-result{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .b-circular{background:var(--surface-3);color:var(--text-secondary);border-color:var(--border)}
  .b-scanned{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .badge.sm{background:var(--surface-3);color:var(--text-secondary);border-color:var(--border)}
  .s-today{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
  .s-soon{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
  .s-up{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
  .s-past{background:var(--surface-3);color:var(--text-muted);border-color:var(--border)}

  /* -------------------------------------------------------- outcome panel
     GOV.UK confirmation-page pattern: the outcome and the reference number
     carried in one high-contrast block. Deliberately contains no links or
     buttons — interactive elements inside a filled panel fail contrast. */
  .panel{border-radius:12px;padding:20px 22px;margin:0 0 16px;border:1px solid;text-align:center}
  .panel.ok{background:var(--ok-soft);border-color:var(--ok-line)}
  .panel.info{background:var(--accent-soft);border-color:var(--accent-line)}
  .panel.neutral{background:var(--surface-2);border-color:var(--border)}
  .panel .eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    color:var(--text-secondary)}
  .panel .big{font-size:clamp(19px,3.4vw,27px);font-weight:600;line-height:1.35;margin:7px 0 0}
  .panel .refline{margin-top:12px;padding-top:12px;border-top:1px solid;border-color:inherit;
    font-size:13px;color:var(--text-secondary)}
  .panel .refline b{display:block;font-size:22px;color:var(--text-primary);font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:.04em}

  .next{margin:18px 0 0}
  .next h4{margin:0 0 8px;font-size:15px;font-weight:600}
  .next ol,.next ul{margin:0;padding-left:20px;color:var(--text-secondary);font-size:14px}
  .next li{margin-bottom:5px}
  .next p{margin:0;color:var(--text-secondary);font-size:14px}

  .cd{margin:0 0 14px;padding:12px 14px;border-radius:11px;line-height:1.5;border:1px solid}
  .cd b{display:block;font-size:17px;margin-bottom:2px;font-weight:600}
  .cd span{font-size:13px}
  .cd-today{background:var(--bad-soft);border-color:var(--bad-line);color:var(--text-primary)}
  .cd-soon{background:var(--warn-soft);border-color:var(--warn-line);color:var(--text-primary)}
  .cd-past{background:var(--surface-2);border-color:var(--border);color:var(--text-secondary)}

  .prov{margin-top:12px;padding:10px 13px;border-radius:9px;font-size:12.5px;line-height:1.6;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary)}
  .prov b{color:var(--text-primary);font-weight:600}
  .scanwarn{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.55;
    background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--text-primary)}

  .meta{color:var(--text-secondary);font-size:14px;margin-bottom:14px}
  .meta b{color:var(--text-primary);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px}
  .cell{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
  .k{font-size:10.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--text-muted);
    margin-bottom:4px;font-weight:600}
  .v{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .v.acc{color:var(--accent)} .v.warn{color:var(--warn)}
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;padding:10px 16px;
    border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid var(--border-control);
    color:var(--text-primary);background:var(--surface-1);cursor:pointer;transition:.16s;
    font-family:inherit;line-height:1.3}
  .btn:hover{background:var(--surface-3);border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
  .mapbox{margin-top:12px;border-radius:11px;overflow:hidden;border:1px solid var(--border);display:none}
  .mapbox iframe{width:100%;height:300px;border:0;display:block}
  :root[data-theme="dark"] .mapbox iframe{filter:invert(.9) hue-rotate(180deg) saturate(.75)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .mapbox iframe{filter:invert(.9) hue-rotate(180deg) saturate(.75)}
  }

  /* ------------------------------------------------------------ roll grid
     The old build joined every roll into one comma-separated string inside a
     table cell. Table cells do not wrap unbroken content, so a 1,037-roll
     notice stretched the cell until the whole PAGE scrolled sideways.
     A wrapping grid cannot do that: minmax(min(100%,…)) clamps each column to
     the container, and any leftover overflow is trapped inside this box. */
  .rollwrap{margin-top:10px}
  .rolltools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
  .rolltools input{flex:1 1 170px;min-width:0;padding:8px 12px;font-size:13.5px;font-family:inherit;
    border-radius:9px;border:1.5px solid var(--border-control);background:var(--surface-1);
    color:var(--text-primary);outline:none;font-variant-numeric:tabular-nums}
  .rolltools input:focus{border-color:var(--accent)}
  .rolltools .btn{padding:8px 13px;font-size:12.5px}
  .rollcount{font-size:12.5px;color:var(--text-muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .rollgrid{display:grid;gap:6px;padding:10px;border-radius:10px;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,5.6rem),1fr));
    background:var(--surface-2);border:1px solid var(--border);
    max-height:min(50vh,400px);overflow:auto;overscroll-behavior:contain}
  .rollchip{font-variant-numeric:tabular-nums;text-align:center;padding:5px 3px;border-radius:7px;
    background:var(--surface-1);border:1px solid var(--border);font-size:13px;
    color:var(--text-secondary);white-space:nowrap}
  .rollchip.hit{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .rollempty{padding:14px;text-align:center;color:var(--text-muted);font-size:13px}
  .grouphead{font-size:13.5px;font-weight:600;margin:14px 0 7px}
  .grouphead:first-child{margin-top:4px}

  /* -------------------------------------------------------- notices list */
  h2{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-muted);
    margin:36px 0 12px;font-weight:600;display:flex;align-items:center;gap:10px}
  h2 .line{flex:1;height:1px;background:var(--border)}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:12.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--border-control);
    background:var(--surface-1);color:var(--text-secondary);cursor:pointer;transition:.15s;
    font-family:inherit;line-height:1.35}
  .chip:hover{color:var(--text-primary)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .ncard{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
    padding:15px 17px;margin-bottom:9px;transition:.15s}
  .ncard:hover{border-color:var(--border-strong)}
  .nhead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .npost{font-weight:600;font-size:16px;line-height:1.4;margin:0}
  .ntitle{color:var(--text-secondary);font-size:13px;line-height:1.5;margin:2px 0 0}
  .nmeta{color:var(--text-muted);font-size:12.5px;margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
  .nmeta a{color:var(--accent)}
  .ncard.past{opacity:.62}
  details{margin-top:10px}
  summary{cursor:pointer;color:var(--text-secondary);font-size:13px;list-style:none;user-select:none;
    padding:4px 0}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"\25B8 ";color:var(--accent)}

  multiPost:"এক নোটিশে একাধিক পদ"
}};

const KIND = {
  seat:     { key:"seat",     cls:"b-seat",     en:"Centre & seat allocation",     labEn:"SEAT PLAN", labBn:"আসন বিন্যাস" },
  viva:     { key:"viva",     cls:"b-viva",     en:"Viva / interview schedule",    labEn:"VIVA",      labBn:"মৌখিক" },
  result:   { key:"result",   cls:"b-result",   en:"Written result",               labEn:"RESULT",    labBn:"ফলাফল" },
  selected: { key:"selected", cls:"b-selected", en:"Primarily selected list",      labEn:"SELECTED",  labBn:"নির্বাচিত" },
  circular: { key:"circular", cls:"b-circular", en:"Schedule / circular",          labEn:"CIRCULAR",  labBn:"বিজ্ঞপ্তি" },
  scanned:  { key:"scanned",  cls:"b-scanned",  en:"Scanned image — not searchable",labEn:"SCANNED",  labBn:"স্ক্যান" }
};
const kindLabel = k => LANG === "bn" ? (KIND[k]||KIND.circular).labBn : (KIND[k]||KIND.circular).labEn;

/* ---------------------------------------------------------------- dates */
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const toISO = s => {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s ?? "").trim());
  return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : null;
};
function dayDiff(iso){
  if (!iso) return null;
  const [y,m,d] = iso.split("-").map(Number);
  const t = new Date(y, m-1, d); t.setHours(0,0,0,0);
  return Math.round((t - TODAY) / 86400000);
}
function statusOf(n){
  const e = dayDiff(n.examDateISO), c = dayDiff(n.closingISO);
  if (e === 0)                       return { k:"today", cls:"s-today", lbl:t("examToday") };
  if (e !== null && e > 0 && e <= 7) return { k:"soon",  cls:"s-soon",  lbl:t("daysLeft")(NUM(e)) };
  if (e !== null && e > 7)           return { k:"up",    cls:"s-up",    lbl:t("upcoming") };
  if (c !== null && c < 0)           return { k:"past",  cls:"s-past",  lbl:t("completed") };
  if (e !== null && e < 0)           return { k:"past",  cls:"s-past",  lbl:t("completed") };
  return { k:"open", cls:"s-up", lbl:t("ongoing") };
}
function countdown(iso, timeLabel, reportBy){
  const d = dayDiff(iso);
  if (d === null) return "";
  let head, cls;
  if (d === 0)               { head = t("cdToday");          cls = "cd-today"; }
  else if (d === 1)          { head = t("cdTomorrow");       cls = "cd-soon";  }
  else if (d > 1 && d <= 21) { head = t("cdDays")(NUM(d));   cls = "cd-soon";  }
  else if (d < 0)            { head = t("cdPast")(NUM(-d));  cls = "cd-past";  }
  else return "";
  const bits = [];
  if (timeLabel) bits.push(timeLabel);
  if (reportBy)  bits.push(t("beThereBy")(reportBy));
  return `<div class="cd ${cls}"><b>${esc(head)}</b><span>${esc(bits.join(" · "))}</span></div>`;
}
const dnum = s => NUM(String(s ?? ""));

/* ------------------------------------------------------------- identity
   A roll number is only unique inside a job, so the job is what every card
   leads with. The post name is what the candidate actually remembers
   applying for, so it is the headline and the job ID is the hard key. */
const POST_RE = /\bposts?\s+of\s*["'\u201c\u2018]?\s*(.+?)\s*["'\u201d\u2019]?\s*(?:\s+(?:of|in)\s+(?:SPCBL|Bangladesh\s+Bank|\d+\s+Banks?)\b|\s*\((?:Job|Grade)|\s*,|\s*$)/i;
function postOf(n, group){
  if (group && group.post) return group.post;
  const g = n.groups || [];
  if (g.length === 1 && g[0].post) return g[0].post;
  if (g.length > 1) return null;                       // multi-post notice
  const title = n.title || "";
  if (/\d+\s+category\s+posts?/i.test(title)) return null;
  const m = POST_RE.exec(title);
  if (!m) return null;
  const p = m[1].replace(/[.\s]+$/, "").trim();
  if (!p || p.length > 60 || /circular|^spcbl/i.test(p)) return null;
  return p;
}
function identBlock(n, group, opts){
  opts = opts || {};
  const post = postOf(n, group);
  const bits = [];
  if (n.noticeNo)  bits.push(`${t("notice")} ${dnum(n.noticeNo)}`);
  if (n.published) bits.push(`${t("published")} ${dnum(n.published)}`);
  return `<div class="ident">
    <div class="jobtag"><span class="k">${esc(t("job"))}</span><span class="v">${esc(dnum(n.jobId || "—"))}</span></div>
    <div class="identtext">
      <p class="post">${esc(post || t("multiPost"))}</p>
      ${bits.length ? `<div class="identmeta">${bits.map(b => `<span>${esc(b)}</span>`).join("")}</div>` : ""}
    </div>
    ${opts.preferred ? `<span class="yours">${esc(t("yoursBadge"))}</span>` : ""}
  </div>`;
}

/* ---------------------------------------------------------------- index */
const notices = DATA.notices.slice();
const scannedCount = notices.filter(n => n.kind === "scanned").length;
notices.forEach(n => {
  if (n.rolls) n._set = new Set(n.rolls.map(String));
  if (n.centres) n.centres.sort((a, b) => a.from - b.from);
  /* Sittings arrive delta-encoded: r = [first, gap, gap, ...]. Undo the deltas
     and build one Map for O(1) roll lookup. Done once at load; for the whole
     dataset this is well under a millisecond, and it keeps the shipped JSON
     5.6x smaller than storing a record per roll. */
  if (n.sittings){
    n._rolls = new Map();
    n._count = 0;
    for (const s of n.sittings){
      let acc = 0;
      for (const d of s.r){ acc += d; n._rolls.set(acc, s); n._count++; }
    }
  }
});
const searchable = notices.filter(n => n.centres || n.sittings || n.rolls);

function findCentre(n, roll){
  const v = n.centres;
  let lo = 0, hi = v.length - 1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1, c = v[mid];
    if (roll < c.from) hi = mid - 1;
    else if (roll > c.to) lo = mid + 1;
    else return c;
  }
  return null;
}
/* "3:00 PM" minus 60 minutes -> "2:00 PM" */
function minus60(label){
  const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(label || "");
  if (!m) return null;
  let h = parseInt(m[1], 10) % 12 + (m[3].toUpperCase() === "PM" ? 12 : 0);
  let x = (h * 60 + parseInt(m[2], 10) - 60 + 1440) % 1440;
  const hh = Math.floor(x / 60), mm = String(x % 60).padStart(2, "0");
  return `${(hh % 12) || 12}:${mm} ${hh < 12 ? "AM" : "PM"}`;
}
const mapsUrl = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;

/* ------------------------------------------------------------ provenance
   Never let an OCR-derived list look hand-checked, and never let either look
   like machine-extracted text. The wording differs on purpose. */
function provenance(n){
  if (n.rollSource === "ocr"){
    const tot = n.ocrChecks && n.ocrChecks.printedTotal ? dnum(n.ocrChecks.printedTotal) : "";
    return `<div class="prov">${t("ocrProv")(tot)}<a href="${esc(n.pdf)}" target="_blank" rel="noopener">${esc(t("confirmPdf"))}</a>.</div>`;
  }
  if (n.rollSource === "manual"){
    return `<div class="prov">${t("manualProv")}<a href="${esc(n.pdf)}" target="_blank" rel="noopener">${esc(t("confirmPdf"))}</a>.</div>`;
  }
  return "";
}

/* --------------------------------------------------------- outcome panel */
function outcomeOf(n){
  const txt = `${n.title || ""} ${n.category || ""}`;
  const hl = LANG === "bn" ? (n.headlineBn || n.headline) : (n.headline || n.headlineBn);
  if (hl) return { tone:"ok", title:hl, steps:null };
  if (/offer\s+letter/i.test(txt))        return { tone:"ok", title:t("congratsOffer"),   steps:t("nextOffer") };
  if (/primarily\s+selected|selected\s+candidate/i.test(txt))
                                          return { tone:"ok", title:t("congratsPrimary"), steps:t("nextPrimary") };
  return { tone:"neutral", title:t("congratsGeneric"), steps:t("nextPrimary") };
}
function nextBlock(steps, note){
  if (note) return `<div class="next"><h4>${esc(t("whatNext"))}</h4><p>${esc(note)}</p></div>`;
  if (!steps || !steps.length) return "";
  return `<div class="next"><h4>${esc(t("whatNext"))}</h4><ol>${
    steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>`;
}

   Rendered lazily: the chips for a 1,037-roll notice are only built when

function rollWrapHtml(rolls, hit){

function paintRolls(wrap){

/* --------------------------------------------------------------- search */
let prefJob = (() => { try { return localStorage.getItem("bb-job") || ""; } catch(e){ return ""; } })();
let lastHits = [];

function collectHits(roll, raw){
  const hits = [];
  for (const n of notices){
    if (n.centres){
      const c = findCentre(n, roll);
      if (c) hits.push({ n, job:String(n.jobId || ""), html:() => seatCard(n, c, raw, isPref(n)) });
    }
    if (n._rolls && n._rolls.has(roll)){
      const s = n._rolls.get(roll);
      hits.push({ n, job:String(n.jobId || ""), html:() => sittingCard(n, { d:s.date, t:s.time, b:s.sl }, raw, isPref(n)) });
    }
    if (n._set && n._set.has(String(roll))){
      hits.push({ n, job:String(n.jobId || ""), html:() => selectedCard(n, roll, isPref(n)) });
    }
  }
  return hits;
}
const isPref = n => !!prefJob && String(n.jobId || "") === prefJob;

function renderResult(){
  const raw = AS($("#roll").value).replace(/\D/g, "");
  const box = $("#result"), dis = $("#disambig");
  if (!raw){ box.innerHTML = ""; dis.innerHTML = ""; lastHits = []; return; }

  if (raw.length < 3){
    dis.innerHTML = "";
    box.innerHTML = `<div class="card bad"><div class="meta" style="margin:0">${esc(t("tooShort")(NUM(raw)))}</div></div>`;
    return;
  }
  const roll = parseInt(raw, 10);
  lastHits = collectHits(roll, raw);

  if (!lastHits.length){
    dis.innerHTML = "";
    const cover = searchable.map(n => {
      const p = postOf(n);
      return `<li>${esc(t("job"))} ${esc(dnum(n.jobId || "—"))} — ${esc(p || (KIND[n.kind]||{}).en || n.kind)}</li>`;
    }).join("");
    box.innerHTML = `<div class="card bad">
      <p class="post" style="margin-bottom:8px">${esc(t("notFoundTitle")(NUM(raw)))}</p>
      <div class="meta">${esc(t("notFoundBody")(NUM(searchable.length)))}</div>
      <div class="meta" style="margin-bottom:6px"><b>${esc(t("notFoundList"))}</b></div>
      <ul style="color:var(--text-secondary);font-size:13px;margin:0 0 0 18px;padding:0">${cover}</ul>
      <div class="actions"><a class="btn" href="${esc(DATA.source)}" target="_blank" rel="noopener">${esc(t("checkPortal"))}</a></div>
    </div>`;
    return;
  }
  paintHits(raw);
}

function paintHits(raw){
  const dis = $("#disambig"), box = $("#result");
  const jobs = [...new Set(lastHits.map(h => h.job))].filter(Boolean);

  /* The core fix: one roll can legitimately belong to two unrelated jobs,
     so when that happens we say so and let the candidate choose. */
  if (jobs.length > 1){
    const opts = jobs.map(j => {
      const n = lastHits.find(h => h.job === j).n;
      const p = postOf(n);
      return `<button type="button" data-job="${esc(j)}" aria-pressed="${prefJob === j}">
        <b>${esc(t("job"))} ${esc(dnum(j))}</b><span>${esc(p || (KIND[n.kind]||{}).en || n.kind)}</span></button>`;
    }).join("");
    dis.innerHTML = `<div class="disambig">
      <p>${esc(t("disambigQ")(NUM(raw), NUM(jobs.length)))}</p>
      <p class="why">${esc(t("disambigWhy"))}</p>
      <div class="jobpick">${opts}
        <button type="button" data-job="" aria-pressed="${!prefJob}">${esc(t("showAll"))}</button></div>
    </div>`;
  } else dis.innerHTML = "";

  /* A remembered job floats to the top but nothing is ever hidden. */
  const ordered = lastHits.slice().sort((a, b) =>
    (isPref(b.n) ? 1 : 0) - (isPref(a.n) ? 1 : 0));
  box.innerHTML = ordered.map(h => h.html()).join("");
}

    </div>
    ${detail}
  </div>`;
}

function renderNotices(){
  const kinds = ["all", ...new Set(notices.map(n => n.kind))];
  $("#filters").innerHTML = kinds.map(k => {
    const lbl = k === "all"
      ? `${t("all")} ${NUM(notices.length)}`
      : `${kindLabel(k)} ${NUM(notices.filter(n => n.kind === k).length)}`;
    return `<button type="button" class="chip${k === filter ? " on" : ""}" data-f="${esc(k)}" aria-pressed="${k === filter}">${esc(lbl)}</button>`;
  }).join("");

  const shown = notices.filter(n => filter === "all" || n.kind === filter);
  const live = shown.filter(n => statusOf(n).k !== "past");
  const past = shown.filter(n => statusOf(n).k === "past");
  const order = { today:0, soon:1, up:2, open:3 };
  live.sort((a, b) => order[statusOf(a).k] - order[statusOf(b).k]);

  /* Archived notices stay fully searchable — they are only collapsed out of
     the way. People look backwards during appeals and document checks. */
  $("#notices").innerHTML = live.map(noticeCard).join("")
    + (past.length ? `<details class="arch"><summary>${esc(t("pastNotices")(NUM(past.length)))}</summary>${
        past.map(noticeCard).join("")}</details>` : "");
}

/* -------------------------------------------------------------- toggles */
function applyTheme(mode){
  const r = document.documentElement;
  if (mode === "system") r.removeAttribute("data-theme");
  else r.setAttribute("data-theme", mode);
  try { mode === "system" ? localStorage.removeItem("bb-theme") : localStorage.setItem("bb-theme", mode); } catch(e){}
  renderToggles();
}
function currentTheme(){
  try { return localStorage.getItem("bb-theme") || "system"; } catch(e){ return "system"; }
}
function renderToggles(){
  const th = currentTheme();
  $("#themeseg").innerHTML = ["system","light","dark"].map(m =>
    `<button type="button" data-theme-set="${m}" aria-pressed="${th === m}">${esc(t(m))}</button>`).join("");
  $("#langseg").innerHTML = [["bn","বাংলা"],["en","English"]].map(([c, l]) =>
    `<button type="button" data-lang-set="${c}" aria-pressed="${LANG === c}">${esc(l)}</button>`).join("");
}
function applyLang(code){
  LANG = code;
  try { localStorage.setItem("bb-lang", code); } catch(e){}
  document.documentElement.setAttribute("data-lang", code);
  document.documentElement.lang = code;
  paintStatic();
  renderToggles();
  renderNotices();
  renderResult();
}
function paintStatic(){
  $("#t-tagline").textContent    = t("tagline");
  $("#roll").placeholder         = t("placeholder");
  $("#t-allnotices").textContent = t("allNotices");
  $("#t-fdata").textContent      = t("fData");
  $("#t-fconfirm").textContent   = t("fConfirm");
  $("#t-fstatic").textContent    = t("fStatic");

  const centres = notices.reduce((a, n) => a + (n.centres ? n.centres.length : 0), 0);
  const rolls   = notices.reduce((a, n) => a + (n._count || 0) + (n.rolls ? n.rolls.length : 0), 0);
  $("#stats").innerHTML =
    `<span class="stat"><b>${NUM(notices.length)}</b> ${esc(t("statNotices"))}</span>
     <span class="stat"><b>${NUM(centres)}</b> ${esc(t("statCentres"))}</span>
     <span class="stat"><b>${NUM(rolls.toLocaleString("en-US"))}</b> ${esc(t("statRolls"))}</span>`;
  $("#hint").textContent = t("hintBase")(NUM(searchable.length))
    + (scannedCount ? t("hintScanned")(NUM(scannedCount)) : "");

  const age = dayDiff(DATA.generated.slice(0, 10));
  const fresh = age === 0 ? t("updToday") : age === -1 ? t("updYesterday")
              : age < 0 ? t("updDays")(NUM(-age)) : t("upd");
  $("#gen").textContent = `${fresh} ${t("builtFrom")(dnum(DATA.generated), NUM(notices.length))} ${t("fDataRest")}`;
}

/* --------------------------------------------------------- interactions */
document.addEventListener("click", e => {
  const map = e.target.closest("[data-map]");
  if (map){
    const box = map.closest(".card").querySelector(".mapbox");
    const ifr = box.querySelector("iframe");
    const open = box.style.display === "block";
    box.style.display = open ? "none" : "block";
    map.textContent = open ? t("showMap") : t("hideMap");
    if (!open && !ifr.src) ifr.src = ifr.dataset.src;
    return;
  }
  const th = e.target.closest("[data-theme-set]");
  if (th){ applyTheme(th.dataset.themeSet); return; }

  const lg = e.target.closest("[data-lang-set]");
  if (lg){ applyLang(lg.dataset.langSet); return; }

  const jp = e.target.closest("[data-job]");
  if (jp){
    prefJob = jp.dataset.job || "";
    try { prefJob ? localStorage.setItem("bb-job", prefJob) : localStorage.removeItem("bb-job"); } catch(err){}
    paintHits(AS($("#roll").value).replace(/\D/g, ""));
    return;
  }
  const cp = e.target.closest(".rollcopy");
  if (cp){
    const wrap = cp.closest(".rollwrap");
    const txt = (wrap.dataset.rolls || "").split(",").join(", ");
    navigator.clipboard?.writeText(txt).then(() => {
      cp.textContent = t("copied");
      setTimeout(() => { cp.textContent = t("copyAll"); }, 1400);
    }).catch(() => {});
    return;
  }
  const f = e.target.closest("[data-f]");
  if (f){ filter = f.dataset.f; renderNotices(); return; }
});

document.addEventListener("input", e => {
  if (e.target.classList.contains("rollfilter")) paintRolls(e.target.closest(".rollwrap"));
});
/* build the chips only when a list is actually opened */
document.addEventListener("toggle", e => {
  if (e.target.tagName !== "DETAILS" || !e.target.open) return;
  e.target.querySelectorAll(".rollwrap").forEach(w => {
    if (!w.dataset.painted){ w.dataset.painted = "1"; paintRolls(w); }
  });
}, true);

/* offline support — only meaningful over http(s); silently skipped on file:// */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}

/* ------------------------------------------------------------------ boot */
(function boot(){
  document.documentElement.setAttribute("data-lang", LANG);
  document.documentElement.lang = LANG;
  paintStatic();
  renderToggles();
  renderNotices();

  $("#roll").addEventListener("input", renderResult);
  $("#roll").addEventListener("keydown", e => {
    if (e.key === "Escape"){ e.target.value = ""; renderResult(); }
  });

  const m = AS(decodeURIComponent(location.hash)).match(/roll=(\d+)/);
  if (m){ $("#roll").value = m[1]; renderResult(); }
})();
</script>
</body>
</html>
