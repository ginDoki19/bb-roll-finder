<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB E-Recruitment — Roll Finder</title>
<meta name="description" content="Enter your roll number to find your Bangladesh Bank exam centre, seat range, date, time and map location. Seat plans, viva schedules and selected-candidate lists in one place.">
<meta name="theme-color" content="#f5fbf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BB Roll">
<link rel="canonical" href="https://bb-roll-finder.pages.dev/">
<meta property="og:title" content="BB E-Recruitment — Roll Finder">
<meta property="og:description" content="Find your exam centre, seat, time and map by roll number.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bb-roll-finder.pages.dev/">

<meta property="og:image:height" content="630">

<meta property="og:locale:alternate" content="bn_BD">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BB E-Recruitment — Roll Finder">

<meta name="twitter:image" content="https://bb-roll-finder.pages.dev/og-card.png">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite",
 "name":"BB E-Recruitment — Roll Finder",
 "alternateName":"BB Roll Finder",
 "url":"https://bb-roll-finder.pages.dev/",
 "inLanguage":["en","bn"],
 "description":"Find your Bangladesh Bank exam centre, seat range, date, time and map location by roll number.",
 "potentialAction":{"@type":"SearchAction",
   "target":{"@type":"EntryPoint","urlTemplate":"https://bb-roll-finder.pages.dev/#roll={roll_number}"},
   "query-input":"required name=roll_number"}}
</script>

<!-- Runs before any CSS so the stored theme is applied on the very first paint.
     Without this the page renders light, then flips to dark a frame later. -->
<script>
(function(){
  try{
    var t = localStorage.getItem("bb-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    var l = localStorage.getItem("bb-lang");
    if (l !== "en" && l !== "bn"){
      /* No saved choice: follow the browser, exactly as core/language.js
         does. Kept in sync by tools/selftest.py. */
      var list = (navigator.languages && navigator.languages.length)
                 ? navigator.languages : [navigator.language];
      l = "en";
      for (var i = 0; i < list.length; i++){
        var tag = String(list[i] || "").toLowerCase();
        if (tag === "bn" || tag.indexOf("bn-") === 0){ l = "bn"; break; }
        if (tag === "en" || tag.indexOf("en-") === 0){ l = "en"; break; }
      }
    }
    document.documentElement.setAttribute("data-lang", l);
    document.documentElement.lang = l;
  }catch(e){}

  /* Font preloads are injected rather than written as static <link> tags.
     A font preload must carry crossorigin (fonts are always fetched in CORS
     mode), but over file:// the origin is null, so the browser rejects the
     request and logs a CORS error for every preloaded font before falling
     back to the @font-face rule. The page still worked; the console was just
     full of errors that looked like real breakage. Injecting them only for
     http(s) keeps the head start online and leaves file:// silent. */
  try{
    if (location.protocol === "http:" || location.protocol === "https:"){
      ["fonts/noto-sans-bengali-bengali-400-normal.woff2",
       "fonts/noto-sans-bengali-latin-400-normal.woff2",
       "fonts/noto-sans-bengali-bengali-600-normal.woff2",
       "fonts/noto-serif-bengali-bengali-600-normal.woff2",
       "fonts/noto-serif-bengali-latin-600-normal.woff2"].forEach(function(href){
        var el = document.createElement("link");
        el.rel = "preload"; el.as = "font"; el.type = "font/woff2";
        el.href = href; el.crossOrigin = "anonymous";
        document.head.appendChild(el);
      });
    }
  }catch(e){}
})();
</script>

<style>
/*__CSS__*/
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">ব</div>
        <div>
          <h1 id="t-brand">BB E-Recruitment — Roll Finder</h1>
          <div class="sub" id="t-tagline"></div>
        </div>
      </div>
      <div class="controls">
        <div class="seg" id="langseg" role="group" aria-label="Language"></div>
        <div class="seg" id="themeseg" role="group" aria-label="Theme"></div>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <main id="main">
    <!-- A real <form> so the search is a landmark and mobile keyboards offer
         a submit key. There is nothing to submit — results render as you type
         — so app.js cancels the submit event; without that, Enter would
         reload the page and lose the query. -->
    <form class="search" role="search" id="searchform">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <label class="sr-only" for="roll" id="t-rolllabel"></label>
      <input id="roll" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="hint">
    </form>
    <div class="hint" id="hint"></div>
    <p class="callout" id="t-fconfirm"></p>

    <!-- The result area is NOT a live region. It can hold several full cards,
         and re-announcing all of them on every keystroke made the page
         unusable with a screen reader. #srstatus carries a one-line summary
         instead, and only when the outcome actually changes. -->
    <p id="srstatus" class="sr-only" role="status" aria-live="polite"></p>
    <div id="disambig"></div>
    <div id="result"></div>

    <section aria-labelledby="t-allnotices">
      <h2><span id="t-allnotices"></span> <span class="line"></span></h2>
      <div class="filters" id="filters" role="group" aria-label="Filter notices by type"></div>
      <div id="notices"></div>
    </section>
  </main>

  <footer>
    <div><b id="t-fdata"></b> <span id="gen"></span></div>
    <div style="margin-top:6px" id="t-fstatic"></div>
  </footer>
</div>

<script>
/*__JS__*/
</script>
</body>
</html>
